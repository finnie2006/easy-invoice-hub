services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: invoice_hub_db
    environment:
      POSTGRES_USER: ${DB_USER:-invoice_hub}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-invoice_hub_password}
      POSTGRES_DB: ${DB_NAME:-invoice_hub}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./supabase/migrations/001-initial-schema.sql:/docker-entrypoint-initdb.d/001-initial-schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-invoice_hub}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Node.js Backend
  server:
    image: ${SERVER_IMAGE:-ghcr.io/finnie2006/easy-invoice-hub-server}:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: invoice_hub_server
    environment:
      NODE_ENV: production
      PORT: 3001
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-invoice_hub}
      DB_USER: ${DB_USER:-invoice_hub}
      DB_PASSWORD: ${DB_PASSWORD:-invoice_hub_password}
      JWT_SECRET: ${JWT_SECRET:-your-secret-key-change-in-production}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-your-refresh-secret-key-change-in-production}
    ports:
      - "3001:3001"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Vite React Frontend
  app:
    image: ${APP_IMAGE:-ghcr.io/finnie2006/easy-invoice-hub-app}:${IMAGE_TAG:-latest}
    pull_policy: ${PULL_POLICY:-missing}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /
    container_name: invoice_hub_app
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped

volumes:
  postgres_data:
  uploads_data:
